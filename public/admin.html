<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PIECENOA 관리자</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Crect%20width%3D'64'%20height%3D'64'%20rx%3D'12'%20fill%3D'%2314171c'%2F%3E%3Ctext%20font-style%3D%22italic%22%20x%3D'32'%20y%3D'47'%20text-anchor%3D'middle'%20font-family%3D'Georgia'%20font-size%3D'48'%20fill%3D'%23eee9db'%3EP%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<header class="admin-header">
  <a class="admin-brand" href="./"><span>PIECENOA</span><small>관리자</small></a>
  <p class="admin-who" id="admin-who"></p>
</header>

<main class="admin-main">
  <section id="admin-gate" class="admin-gate" aria-live="polite">
    <p id="admin-gate-text">확인 중이에요…</p>
    <a id="admin-gate-link" class="admin-button" href="./" hidden>사이트로 돌아가서 로그인하기</a>
  </section>

  <div id="admin-app" hidden>
    <nav class="admin-tabs" role="tablist" aria-label="관리 메뉴">
      <button role="tab" aria-selected="true" data-tab="overview">개요</button>
      <button role="tab" aria-selected="false" data-tab="reports">신고 <span id="reports-badge" class="admin-badge" hidden></span></button>
      <button role="tab" aria-selected="false" data-tab="listings">작품</button>
      <button role="tab" aria-selected="false" data-tab="members">회원</button>
    </nav>

    <section data-panel="overview" class="admin-panel">
      <div class="admin-stats" id="stats"></div>
      <div class="admin-maintenance">
        <h2>저장소 정리</h2>
        <p class="admin-meta">삭제한 지 30일이 지난 작품을 완전히 지우고, 아무 데도 쓰이지 않는 사진 파일(하루 이상 지난 것)을 지워요. 매일 자동으로도 실행돼요.</p>
        <button class="admin-button" type="button" id="run-cleanup">지금 정리하기</button>
        <p class="admin-meta" id="cleanup-result" aria-live="polite"></p>
      </div>
    </section>

    <section data-panel="reports" class="admin-panel" hidden>
      <div class="admin-toolbar">
        <label>상태
          <select id="report-filter">
            <option value="open">처리 대기 (접수·검토 중)</option>
            <option value="closed">처리 끝남</option>
            <option value="all">전체</option>
          </select>
        </label>
      </div>
      <div id="reports" class="admin-list"></div>
    </section>

    <section data-panel="listings" class="admin-panel" hidden>
      <form class="admin-toolbar" id="listing-search">
        <label>제목 검색 <input id="listing-query" type="search" maxlength="60" autocomplete="off"></label>
        <label>보기
          <select id="listing-filter">
            <option value="all">전체 (삭제 제외)</option>
            <option value="public">공개 중</option>
            <option value="private">비공개</option>
            <option value="hidden">숨김 처리됨</option>
            <option value="deleted">삭제됨</option>
          </select>
        </label>
        <button class="admin-button" type="submit">찾기</button>
      </form>
      <div id="listings" class="admin-list"></div>
    </section>

    <section data-panel="members" class="admin-panel" hidden>
      <form class="admin-toolbar" id="member-search">
        <label>이메일 또는 이름 <input id="member-query" type="search" maxlength="80" autocomplete="off"></label>
        <button class="admin-button" type="submit">찾기</button>
      </form>
      <div id="members" class="admin-list"></div>
    </section>
  </div>
</main>
<div class="admin-toast" id="admin-toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
