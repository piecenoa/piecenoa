<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PIECENOA 관리자</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/icon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
<style>:root{--bg:#f4f1ea;--surface:#fbf9f4;--line:#ded7ca;--text:#2f2a23;--muted:#7a6f61;--accent:#80583e;--accent-ink:#fffaf2;--warn:#9b4332;--warn-bg:#f3e3da;--serif:"Cormorant Garamond",Georgia,serif;--sans:"DM Sans","Pretendard",system-ui,sans-serif}@media(prefers-color-scheme:dark){:root{--bg:#1d1b18;--surface:#25221e;--line:#3d372f;--text:#ece5d8;--muted:#ab9f8d;--accent:#c0a475;--accent-ink:#231d15;--warn:#e0b18c;--warn-bg:#3c2e25}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 var(--sans)}button,input,select{font:inherit;color:inherit}.admin-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px;border-bottom:1px solid var(--line);background:var(--surface)}.admin-brand{display:flex;align-items:baseline;gap:10px;color:inherit;text-decoration:none}.admin-brand span{font:italic 400 26px/1 var(--serif);letter-spacing:-.02em}.admin-brand small{font-size:12px;color:var(--muted)}.admin-who{margin:0;font-size:12px;color:var(--muted);overflow-wrap:anywhere;text-align:right}.admin-main{max-width:1080px;margin:0 auto;padding:24px 16px 80px}.admin-gate{padding:48px 16px;text-align:center;color:var(--muted)}.admin-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}.admin-tabs button{border:0;background:none;padding:12px 16px;min-height:44px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}.admin-tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}.admin-badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px}.admin-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.admin-stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:4px}.admin-stat span{font-size:12px;color:var(--muted)}.admin-stat strong{font:500 30px/1.1 var(--sans);font-variant-numeric:tabular-nums}.admin-stat small{font-size:12px;color:var(--muted)}.admin-toolbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:16px}.admin-toolbar label{display:grid;gap:4px;font-size:12px;color:var(--muted)}.admin-toolbar input,.admin-toolbar select{min-height:40px;min-width:200px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}.admin-button,.admin-actions button{min-height:40px;padding:8px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}.admin-actions button{background:transparent;color:var(--text);border-color:var(--line)}.admin-actions button:hover{border-color:var(--accent)}.admin-actions button:disabled,.admin-button:disabled{opacity:.5;cursor:progress}.admin-list{display:grid;gap:10px}.admin-row{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}.admin-row img,.admin-thumb{width:64px;height:64px;border-radius:6px;object-fit:cover;background:var(--line);display:grid;place-items:center}.admin-thumb.is-person{border-radius:50%;font:italic 26px var(--serif);color:var(--muted)}.admin-row-body p{margin:0;overflow-wrap:anywhere}.admin-row-title{font-weight:500}.admin-meta{font-size:12px;color:var(--muted)}.admin-actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}.admin-chip{display:inline-block;padding:1px 8px;border-radius:10px;border:1px solid var(--line);font-size:11px;font-weight:400;color:var(--muted)}.admin-chip.is-warn{border-color:var(--warn);color:var(--warn)}.admin-empty{color:var(--muted);padding:24px 0;text-align:center}.admin-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);opacity:0;pointer-events:none;max-width:90vw;padding:12px 20px;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 24px #0002;transition:opacity .2s,transform .2s}.admin-toast.show{opacity:1;transform:translate(-50%,0)}.admin-toast.is-error{border-color:var(--warn);color:var(--warn)}@media(max-width:640px){.admin-row{grid-template-columns:48px 1fr}.admin-row img,.admin-thumb{width:48px;height:48px}.admin-actions{grid-column:1/-1;justify-content:flex-start}.admin-toolbar input,.admin-toolbar select{min-width:0;width:100%}.admin-toolbar label{flex:1 1 100%}}.admin-maintenance{margin-top:28px;padding:16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:grid;gap:8px;justify-items:start}.admin-maintenance h2{margin:0;font-size:15px;font-weight:500}.admin-maintenance p{margin:0}
</style>
</head>
<body>
<header class="admin-header">
  <a class="admin-brand" href="./"><span>PIECENOA</span><small>관리자</small></a>
  <p class="admin-who" id="admin-who"></p>
</header>

<main class="admin-main">
  <section id="admin-gate" class="admin-gate" aria-live="polite">
    <p id="admin-gate-text">확인 중이에요…</p>
    <a id="admin-gate-link" class="admin-button" href="./" hidden>사이트로 돌아가서 로그인하기</a>
  </section>

  <div id="admin-app" hidden>
    <nav class="admin-tabs" role="tablist" aria-label="관리 메뉴">
      <button role="tab" aria-selected="true" data-tab="overview">개요</button>
      <button role="tab" aria-selected="false" data-tab="reports">신고 <span id="reports-badge" class="admin-badge" hidden></span></button>
      <button role="tab" aria-selected="false" data-tab="listings">작품</button>
      <button role="tab" aria-selected="false" data-tab="members">회원</button>
    </nav>

    <section data-panel="overview" class="admin-panel">
      <div class="admin-stats" id="stats"></div>
      <div class="admin-maintenance">
        <h2>저장소 정리</h2>
        <p class="admin-meta">삭제한 지 30일이 지난 작품을 완전히 지우고, 아무 데도 쓰이지 않는 사진 파일(하루 이상 지난 것)을 지워요. 매일 자동으로도 실행돼요.</p>
        <button class="admin-button" type="button" id="run-cleanup">지금 정리하기</button>
        <p class="admin-meta" id="cleanup-result" aria-live="polite"></p>
      </div>
    </section>

    <section data-panel="reports" class="admin-panel" hidden>
      <div class="admin-toolbar">
        <label>상태
          <select id="report-filter">
            <option value="open">처리 대기 (접수·검토 중)</option>
            <option value="closed">처리 끝남</option>
            <option value="all">전체</option>
          </select>
        </label>
      </div>
      <div id="reports" class="admin-list"></div>
    </section>

    <section data-panel="listings" class="admin-panel" hidden>
      <form class="admin-toolbar" id="listing-search">
        <label>제목 검색 <input id="listing-query" type="search" maxlength="60" autocomplete="off"></label>
        <label>보기
          <select id="listing-filter">
            <option value="all">전체 (삭제 제외)</option>
            <option value="public">공개 중</option>
            <option value="private">비공개</option>
            <option value="hidden">숨김 처리됨</option>
            <option value="deleted">삭제됨</option>
          </select>
        </label>
        <button class="admin-button" type="submit">찾기</button>
      </form>
      <div id="listings" class="admin-list"></div>
    </section>

    <section data-panel="members" class="admin-panel" hidden>
      <form class="admin-toolbar" id="member-search">
        <label>이메일 또는 이름 <input id="member-query" type="search" maxlength="80" autocomplete="off"></label>
        <button class="admin-button" type="submit">찾기</button>
      </form>
      <div id="members" class="admin-list"></div>
    </section>
  </div>
</main>
<div class="admin-toast" id="admin-toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>window.PIECENOA_CONFIG=Object.freeze({"supabaseUrl":"https://hqmzksyaktkpvpnugzpf.supabase.co","supabaseKey":"sb_publishable_9JQp8RYanQ0IkWgtdNm2sA_WWoPhu5N"});
</script>
<script>(()=>{"use strict";const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);const gate=(text,showLink)=>{$("#admin-gate-text").textContent=text;$("#admin-gate-link").hidden=!showLink;$("#admin-gate").hidden=false;$("#admin-app").hidden=true};const config=window.PIECENOA_CONFIG;if(!config?.supabaseUrl||typeof window.supabase?.createClient!=="function"){gate("Supabase 연결 설정이 없어요. js/config.js를 확인해 주세요.",false);return}const db=window.supabase.createClient(config.supabaseUrl,config.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:"piecenoa.auth.v1"}});const storageBase=config.supabaseUrl.replace(/\/$/,"")+"/storage/v1/object/public/";const imageUrl=path=>path?storageBase+"listing-images/"+path.split("/").map(encodeURIComponent).join("/"):"";const MINOR={JPY:0,KRW:0,VND:0};const money=(minor,currency)=>{const digits=MINOR[currency]??2;try{return new Intl.NumberFormat("ko-KR",{style:"currency",currency,minimumFractionDigits:digits,maximumFractionDigits:digits}).format(minor/10**digits)}catch{return minor+" "+currency}};const when=iso=>iso?new Intl.DateTimeFormat("ko-KR",{dateStyle:"medium",timeStyle:"short"}).format(new Date(iso)):"—";const REASONS={spam:"스팸·오해 소지",scam:"사기 의심",counterfeit:"위작·작가 표기 오류",prohibited:"판매 금지 품목",offensive:"불쾌한 내용",other:"기타"};const STATUS={open:"접수",reviewing:"검토 중",resolved:"처리 완료",dismissed:"기각"};let toastTimer=0;function toast(text,isError){const box=$("#admin-toast");box.textContent=text;box.classList.toggle("is-error",Boolean(isError));box.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.classList.remove("show"),3200)}function explain(error){const m=String(error?.message||"");if(/FORBIDDEN|42501/.test(m)||error?.code==="42501")return"관리자 권한이 없어요.";if(/CANNOT_BAN_SELF/.test(m))return"자기 자신은 제재할 수 없어요.";if(/CANNOT_BAN_ADMIN/.test(m))return"관리자 계정은 제재할 수 없어요.";if(/NOT_FOUND/.test(m))return"대상을 찾지 못했어요. 새로고침해 주세요.";return"처리하지 못했어요. 잠시 후 다시 시도해 주세요."}async function run(button,task,done){if(button)button.disabled=true;try{await task();if(done)toast(done)}catch(error){console.warn("[PIECENOA admin]",error);toast(explain(error),true)}finally{if(button)button.disabled=false}}const ask=(question,fallback="")=>{const value=window.prompt(question,fallback);return value===null?null:value.trim()};async function loadStats(){const{data,error}=await db.rpc("admin_stats");if(error)throw error;const cards=[["회원",data.members,"최근 7일 가입 "+data.members_7d+"명"],["제재 중인 회원",data.members_banned,""],["작품 (삭제 제외)",data.listings,"최근 7일 등록 "+data.listings_7d+"개"],["공개 중",data.listings_public,"비공개 "+data.listings_private+" · 숨김 "+data.listings_hidden],["처리 대기 신고",data.reports_open,""],["대화",data.conversations,"최근 7일 메시지 "+data.messages_7d+"개"],["관심 저장",data.favorites,""]];$("#stats").innerHTML=cards.map(([label,value,note])=>'<div class="admin-stat"><span>'+esc(label)+"</span><strong>"+esc(Number(value).toLocaleString("ko-KR"))+"</strong>"+(note?"<small>"+esc(note)+"</small>":"")+"</div>").join("");$("#reports-badge").textContent=data.reports_open;$("#reports-badge").hidden=!data.reports_open}async function loadReports(){const filter=$("#report-filter").value;let query=db.from("reports").select("id, target_type, reason, details, status, created_at, snapshot, resolution_note, listing_id, reporter:profiles!reports_reporter_id_fkey(display_name), listing:listings(id, title, moderation_status, image_path, deleted_at)").order("created_at",{ascending:false}).limit(100);if(filter==="open")query=query.in("status",["open","reviewing"]);if(filter==="closed")query=query.in("status",["resolved","dismissed"]);const{data,error}=await query;if(error)throw error;$("#reports").innerHTML=data.length?data.map(r=>{const listing=r.listing;const title=listing?.title||r.snapshot?.title||"(삭제된 대상)";const hidden=listing?.moderation_status==="hidden";return'<article class="admin-row" data-report="'+esc(r.id)+'" data-listing="'+esc(r.listing_id||"")+'">'+(listing?.image_path||r.snapshot?.image_path?'<img alt="" src="'+esc(imageUrl(listing?.image_path||r.snapshot.image_path))+'">':'<span class="admin-thumb"></span>')+'<div class="admin-row-body"><p class="admin-row-title">'+esc(title)+' <span class="admin-chip">'+esc(STATUS[r.status]||r.status)+"</span>"+(hidden?' <span class="admin-chip is-warn">숨김</span>':"")+"</p><p>사유: "+esc(REASONS[r.reason]||r.reason)+(r.details?" — "+esc(r.details):"")+'</p><p class="admin-meta">신고자 '+esc(r.reporter?.display_name||"알 수 없음")+" · "+esc(when(r.created_at))+(r.resolution_note?" · 메모: "+esc(r.resolution_note):"")+'</p></div><div class="admin-actions">'+(r.listing_id&&listing?'<button data-act="listing-hide" data-hidden="'+(hidden?"0":"1")+'">'+(hidden?"작품 다시 공개":"작품 숨기기")+"</button>":"")+(r.status==="open"?'<button data-act="report-status" data-status="reviewing">검토 중</button>':"")+(["open","reviewing"].includes(r.status)?'<button data-act="report-status" data-status="resolved">처리 완료</button><button data-act="report-status" data-status="dismissed">기각</button>':'<button data-act="report-status" data-status="open">다시 열기</button>')+"</div></article>"}).join(""):'<p class="admin-empty">신고가 없어요.</p>'}async function loadListings(){const filter=$("#listing-filter").value,term=$("#listing-query").value.trim();let query=db.from("listings").select("id, title, price_minor, currency, visibility, moderation_status, moderation_reason, deleted_at, created_at, image_path, favorite_count, conversation_count, seller:profiles!listings_seller_id_fkey(id, display_name)").order("created_at",{ascending:false}).limit(100);if(filter==="deleted")query=query.not("deleted_at","is",null);else query=query.is("deleted_at",null);if(filter==="public")query=query.eq("visibility","public").eq("moderation_status","active");if(filter==="private")query=query.eq("visibility","private");if(filter==="hidden")query=query.eq("moderation_status","hidden");if(term)query=query.ilike("title","%"+term.replace(/[\\%_]/g,c=>"\\"+c)+"%");const{data,error}=await query;if(error)throw error;$("#listings").innerHTML=data.length?data.map(l=>{const hidden=l.moderation_status==="hidden";const chips=[l.deleted_at?"삭제됨":"",l.visibility==="private"?"비공개":"",hidden?l.moderation_reason==="ACCOUNT_SUSPENDED"?"회원 제재로 숨김":"숨김":""].filter(Boolean).map(c=>'<span class="admin-chip is-warn">'+esc(c)+"</span>").join(" ");return'<article class="admin-row" data-listing="'+esc(l.id)+'">'+(l.image_path?'<img alt="" src="'+esc(imageUrl(l.image_path))+'">':'<span class="admin-thumb"></span>')+'<div class="admin-row-body"><p class="admin-row-title">'+esc(l.title)+" "+chips+"</p><p>"+esc(money(l.price_minor,l.currency))+" · 판매자 "+esc(l.seller?.display_name||"알 수 없음")+'</p><p class="admin-meta">관심 '+esc(l.favorite_count)+" · 대화 "+esc(l.conversation_count)+" · 등록 "+esc(when(l.created_at))+(hidden&&l.moderation_reason&&l.moderation_reason!=="ACCOUNT_SUSPENDED"?" · 사유: "+esc(l.moderation_reason):"")+'</p></div><div class="admin-actions">'+(l.deleted_at?"":'<button data-act="listing-hide" data-hidden="'+(hidden?"0":"1")+'">'+(hidden?"다시 공개":"숨기기")+"</button>")+"</div></article>"}).join(""):'<p class="admin-empty">조건에 맞는 작품이 없어요.</p>'}async function loadMembers(){const{data,error}=await db.rpc("admin_members",{p_search:$("#member-query").value.trim(),p_limit:100,p_offset:0});if(error)throw error;$("#members").innerHTML=data.length?data.map(m=>'<article class="admin-row" data-member="'+esc(m.id)+'"><span class="admin-thumb is-person">'+esc((m.display_name||m.email||"?").slice(0,1).toUpperCase())+'</span><div class="admin-row-body"><p class="admin-row-title">'+esc(m.display_name||"(이름 없음)")+(m.is_admin?' <span class="admin-chip">관리자</span>':"")+(m.banned?' <span class="admin-chip is-warn">제재 중</span>':"")+(m.email_confirmed?"":' <span class="admin-chip">이메일 미인증</span>')+"</p><p>"+esc(m.email)+" · 작품 "+esc(m.listing_count)+'개</p><p class="admin-meta">가입 '+esc(when(m.created_at))+" · 마지막 로그인 "+esc(when(m.last_sign_in_at))+(m.banned&&m.ban_reason?" · 제재 사유: "+esc(m.ban_reason):"")+'</p></div><div class="admin-actions">'+(m.is_admin?"":'<button data-act="member-ban" data-banned="'+(m.banned?"0":"1")+'">'+(m.banned?"제재 풀기":"제재하기")+"</button>")+"</div></article>").join(""):'<p class="admin-empty">회원을 찾지 못했어요.</p>'}const loaders={overview:loadStats,reports:loadReports,listings:loadListings,members:loadMembers};let current="overview";function show(tab){current=tab;$$("[data-tab]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab)));$$("[data-panel]").forEach(p=>{p.hidden=p.dataset.panel!==tab});return run(null,loaders[tab])}const refresh=()=>Promise.all([run(null,loadStats),current==="overview"?null:run(null,loaders[current])]);document.addEventListener("click",event=>{const tab=event.target.closest("[data-tab]");if(tab){show(tab.dataset.tab);return}const button=event.target.closest("[data-act]");if(!button)return;const row=button.closest(".admin-row");if(button.dataset.act==="listing-hide"){const hide=button.dataset.hidden==="1";const reason=hide?ask("숨기는 사유를 적어 주세요. 판매자에게 보여요.","운영 정책 위반"):"";if(reason===null)return;run(button,async()=>{const{error}=await db.rpc("admin_set_listing_hidden",{p_listing:row.dataset.listing,p_hidden:hide,p_reason:reason});if(error)throw error;await refresh()},hide?"작품을 숨겼어요.":"작품을 다시 공개했어요.")}else if(button.dataset.act==="report-status"){const status=button.dataset.status;const note=["resolved","dismissed"].includes(status)?ask("처리 메모 (선택)",""):"";if(note===null)return;run(button,async()=>{const{error}=await db.rpc("admin_update_report",{p_report:row.dataset.report,p_status:status,p_note:note});if(error)throw error;await refresh()},"신고 상태를 바꿨어요.")}else if(button.dataset.act==="member-ban"){const ban=button.dataset.banned==="1";const reason=ban?ask("제재 사유를 적어 주세요. 이 회원의 작품도 마켓에서 숨겨져요.","운영 정책 위반"):"";if(reason===null)return;if(!ban&&!window.confirm("이 회원의 제재를 풀까요? 제재 때문에 숨겨진 작품도 다시 공개돼요."))return;run(button,async()=>{const{error}=await db.rpc("admin_set_member_ban",{p_user:row.dataset.member,p_banned:ban,p_reason:reason});if(error)throw error;await refresh()},ban?"회원을 제재했어요.":"제재를 풀었어요.")}});$("#run-cleanup").addEventListener("click",event=>{const button=event.currentTarget;if(!window.confirm("삭제한 지 30일이 지난 작품과 쓰이지 않는 사진 파일을 지울까요? 되돌릴 수 없어요."))return;run(button,async()=>{const{data,error}=await db.functions.invoke("cleanup-storage",{method:"POST"});if(error)throw Object.assign(new Error(error.message||"CLEANUP_FAILED"),{cause:error});$("#cleanup-result").textContent="완료: 작품 "+(data?.listingsRemoved??0)+"개, 사진 파일 "+(data?.filesRemoved??0)+"개를 지웠어요. ("+when(new Date().toISOString())+")";await loadStats()},"저장소를 정리했어요.")});$("#report-filter").addEventListener("change",()=>run(null,loadReports));$("#listing-search").addEventListener("submit",e=>{e.preventDefault();run(null,loadListings)});$("#listing-filter").addEventListener("change",()=>run(null,loadListings));$("#member-search").addEventListener("submit",e=>{e.preventDefault();run(null,loadMembers)});(async()=>{const{data}=await db.auth.getSession();const session=data.session;if(!session){gate("관리자 화면은 로그인한 뒤에 볼 수 있어요. 사이트에서 로그인한 다음 이 페이지를 다시 열어 주세요.",true);return}const{data:isAdmin,error}=await db.rpc("is_admin");if(error||!isAdmin){gate("관리자만 볼 수 있는 페이지예요.",false);return}$("#admin-who").textContent=session.user.email+" · 관리자";$("#admin-gate").hidden=true;$("#admin-app").hidden=false;show("overview")})()})();
